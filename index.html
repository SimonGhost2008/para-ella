<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para Sara ❤️</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:black;
    overflow:hidden;
    font-family:Arial, sans-serif;
}

canvas{
    display:block;
}

#textoCentral{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    color:white;
    font-size:60px;
    font-weight:bold;
    text-shadow:
        0 0 10px red,
        0 0 20px red,
        0 0 40px red,
        0 0 80px red;
    animation:latido 1.5s infinite;
}

@keyframes latido{
    0%{
        transform:translate(-50%,-50%) scale(1);
    }
    50%{
        transform:translate(-50%,-50%) scale(1.12);
    }
    100%{
        transform:translate(-50%,-50%) scale(1);
    }
}

</style>
</head>

<body>

<div id="textoCentral">Sara ❤️</div>

<canvas id="canvas"></canvas>

<audio autoplay loop>
    <source src="musica.mp3" type="audio/mpeg">
</audio>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

function resize(){
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}

resize();
window.addEventListener("resize", resize);

const mensajes = [
    "Te Amo ❤️",
    "Mi Vida ❤️",
    "Mi Cielo ❤️",
    "Mi Princesa ❤️",
    "Mi Destino ❤️",
    "Mi Amor ❤️",
    "Eres Mi Todo ❤️",
    "Sara ❤️"
];

let tiempo = 0;

function animar(){

    tiempo += 0.01;

    ctx.clearRect(0,0,canvas.width,canvas.height);

    let escala = 20 + Math.sin(tiempo * 3) * 2;

    for(let t = 0; t < Math.PI * 2; t += 0.10){

        let x = 16 * Math.pow(Math.sin(t),3);

        let y = -(13*Math.cos(t)
                -5*Math.cos(2*t)
                -2*Math.cos(3*t)
                -Math.cos(4*t));

        let giro = tiempo;

        let rx = x * Math.cos(giro) - y * Math.sin(giro);
        let ry = x * Math.sin(giro) + y * Math.cos(giro);

        let px = canvas.width/2 + rx * escala;
        let py = canvas.height/2 + ry * escala;

        let texto = mensajes[Math.floor(t*20) % mensajes.length];

        ctx.font = "bold 18px Arial";
        ctx.fillStyle = "#ff0000";

        ctx.shadowColor = "#ff0000";
        ctx.shadowBlur = 20;

        ctx.fillText(texto, px, py);
    }

    requestAnimationFrame(animar);
}

animar();

</script>

</body>
</html>
